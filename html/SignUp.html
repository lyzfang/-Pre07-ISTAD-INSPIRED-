            <p class="field-error hidden text-[11px] text-red-600 mt-1"></p>

            <div class="relative">

                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />

                </svg>
              </button>
            </div>

          </div>

          <div>
            <label for="confirmPassword" class="block text-xs font-semibold text-gray-900 mb-1">Confirm Password</label>

              <button type="button" class="toggle-password absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-800" aria-label="Show password" tabindex="-1">
                <svg class="icon-eye w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />

          <button type="submit" id="signupSubmitBtn"

  <script src="../vendor/flowbite/flowbite.min.js"> </script>
    <script src="../vendor/preline/preline.js"></script>
    <!-- STADIA API wiring -->
    <script src="../vendor/multiavatar/multiavatar.min.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Carry through any `redirect` (e.g. someone was sent here from a
        // guarded action like Post Creator) so Sign In and the post-register
        // hop to login.html both remember where to send the user afterward.
        const redirectParam = new URLSearchParams(window.location.search).get('redirect');
        const signInLink = document.getElementById('signInLink');
        if (redirectParam) {
          signInLink.href = './login.html?redirect=' + encodeURIComponent(redirectParam);
        }

        // If already logged in, no reason to be here.
        if (window.AuthAPI && AuthAPI.isAuthenticated()) {
          window.location.href = redirectParam ? decodeURIComponent(redirectParam) : './dashboard.html';
          return;
        }

        const signupForm = document.getElementById('signupForm');
        const formAlert = document.getElementById('formAlert');

        const fields = {
          firstName: document.getElementById('firstName'),
          lastName: document.getElementById('lastName'),
          username: document.getElementById('username'),
          email: document.getElementById('email'),
          password: document.getElementById('password'),
          confirmPassword: document.getElementById('confirmPassword'),
        };
        const signupSubmitBtn = document.getElementById('signupSubmitBtn');
        const signupSubmitLabel = document.getElementById('signupSubmitLabel');
        const signupSubmitSpinner = document.getElementById('signupSubmitSpinner');

        // Show/hide password toggles (works for any number of .toggle-password buttons)
        document.querySelectorAll('.toggle-password').forEach(btn => {
          const input = btn.parentElement.querySelector('input');
          const eyeOpen = btn.querySelector('.icon-eye');
          const eyeOff = btn.querySelector('.icon-eye-off');
          btn.addEventListener('click', () => {
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            eyeOpen.classList.toggle('hidden', show);
            eyeOff.classList.toggle('hidden', !show);
          });
        });

        function showFormAlert(message) {
          formAlert.textContent = message;
          formAlert.classList.remove('hidden');
        }
        function hideFormAlert() {
          formAlert.classList.add('hidden');
        }
        function fieldErrorEl(input) {
          return input.parentElement.querySelector('.field-error');
        }
        function showFieldError(input, message) {
          const el = fieldErrorEl(input);
          if (el) { el.textContent = message; el.classList.remove('hidden'); }
          input.classList.add('border-red-400');
        }
        function clearFieldError(input) {
          const el = fieldErrorEl(input);
          if (el) { el.textContent = ''; el.classList.add('hidden'); }
          input.classList.remove('border-red-400');
        }
        function clearAllErrors() {
          hideFormAlert();
          Object.values(fields).forEach(clearFieldError);
        }

        const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const USERNAME_RE = /^[a-zA-Z0-9_.-]{3,50}$/;

        // Full client-side validation matching the backend's requirements
        // (username, given_name, family_name, email, password all required
        // non-empty strings) so problems surface before we ever call the API.
        function validate() {
          let valid = true;

          const firstName = fields.firstName.value.trim();
          if (!firstName) { showFieldError(fields.firstName, 'First name is required.'); valid = false; }

          const lastName = fields.lastName.value.trim();
          if (!lastName) { showFieldError(fields.lastName, 'Last name is required.'); valid = false; }

          const username = fields.username.value.trim();
          if (!username) {
            showFieldError(fields.username, 'Username is required.');
            valid = false;
          } else if (!USERNAME_RE.test(username)) {
            showFieldError(fields.username, '3-50 characters: letters, numbers, dot, dash, underscore only.');
            valid = false;
          }

          const email = fields.email.value.trim();
          if (!email) {
            showFieldError(fields.email, 'Email is required.');
            valid = false;
          } else if (!EMAIL_RE.test(email)) {
            showFieldError(fields.email, 'Enter a valid email address.');
            valid = false;
          }

          const password = fields.password.value;
          if (!password) {
            showFieldError(fields.password, 'Password is required.');
            valid = false;
          } else if (password.length < 8) {
            showFieldError(fields.password, 'Password must be at least 8 characters.');
            valid = false;
          }

          const confirmPassword = fields.confirmPassword.value;
          if (!confirmPassword) {
            showFieldError(fields.confirmPassword, 'Please confirm your password.');
            valid = false;
          } else if (password && confirmPassword !== password) {
            showFieldError(fields.confirmPassword, 'Passwords do not match.');
            valid = false;
          }

          return valid;
        }

        // Clear a field's error as soon as the user edits it
        Object.values(fields).forEach(input => {
          input.addEventListener('input', () => clearFieldError(input));
        });

        signupForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          clearAllErrors();

          if (!validate()) {
            showFormAlert('Please fix the highlighted fields below.');
            return;
          }

          signupSubmitBtn.disabled = true;
          signupSubmitSpinner.classList.remove('hidden');
          signupSubmitLabel.textContent = 'Creating account...';
          try {
            await AuthAPI.register({
              email: fields.email.value.trim(),
              username: fields.username.value.trim(),
              given_name: fields.firstName.value.trim(),
              family_name: fields.lastName.value.trim(),
              gender: 'Other',
              password: fields.password.value,
            });
            if (window.ApiUtils) ApiUtils.showSuccess('Account created! Please sign in.');
            // Registration succeeded but does NOT auto-login (see auth.js) --
            // send the user to the Login page to sign in with their new account.
            const signupUrl = './signup.html?registered=1' +
              (redirectParam ? '&redirect=' + encodeURIComponent(redirectParam) : '');
            window.location.href = signupUrl;
          } catch (err) {
            const message = err.message || 'Registration failed. Please try again.';
            showFormAlert(message);
            if (window.ApiUtils) ApiUtils.showError(message);
          } finally {
            signupSubmitBtn.disabled = false;
            signupSubmitSpinner.classList.add('hidden');
            signupSubmitLabel.textContent = 'Create your account';
          }
        });
      });
    </script>
