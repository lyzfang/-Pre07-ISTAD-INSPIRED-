<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Personal Info</title>
<meta name="description" content="Manage your STADIA account settings.">
<meta name="robots" content="noindex, nofollow">
<script>(function(){try{var t=localStorage.getItem('stadia_theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}if(t==='dark')document.documentElement.classList.add('dark');}catch(e){}})();</script>
<link href="../src/output.css" rel="stylesheet">
</head>
<body class="bg-white min-h-screen">

<!-- Account-area navbar: logo (-> home) + profile dropdown (Dashboard,
     Settings, Log out) + dark mode toggle. Shared across dashboard.html,
     favorite-page.html, history-page.html and settings.html. -->
<nav class="bg-white border-b border-gray-200 sticky top-0 z-30">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="/index.html" class="flex items-center gap-2">
      <img src="../image/stadia-logo-transparent.png" class="h-15 w-auto">
    </a>
    <div class="flex items-center gap-2">
      <button type="button" data-action="toggle-theme" title="Toggle dark mode" class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-600">
        <svg class="theme-icon-sun w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m8.66-9h-1M4.34 12h-1m14.14 6.66l-.7-.7M7.05 7.05l-.7-.7m11.32 0l-.7.7M7.05 16.95l-.7.7M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <svg class="theme-icon-moon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>
      <div class="relative">
        <button type="button" id="navProfileBtn" class="flex items-center gap-2 pl-1.5 pr-3 py-1.5 rounded-full hover:bg-gray-100" aria-haspopup="true" aria-expanded="false">
          <span id="navProfileAvatar" class="w-8 h-8 rounded-full bg-gray-300 overflow-hidden flex items-center justify-center text-white text-xs font-bold shrink-0"></span>
          <span id="navProfileName" class="hidden sm:inline text-sm font-semibold text-gray-800">Account</span>
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
        </button>
        <div id="navProfileMenu" class="hidden absolute right-0 top-full mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-100 py-1 z-30">
          <a href="/dashboard.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">My Posts</a>
          <a href="/favorite-page.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Bookmarks</a>
          <a href="/history-page.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Recently Viewed</a>
          <a href="/settings.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Settings</a>
          <div class="border-t border-gray-100 my-1"></div>
          <button type="button" id="navProfileLogout" class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">Log out</button>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="max-w-6xl mx-auto py-6 px-4 md:flex md:items-start md:gap-6">

  <!-- Desktop sidebar (mobile falls back to the in-form Log out button below) -->
  <aside class="hidden md:flex md:flex-col w-60 shrink-0 bg-white border border-gray-100 rounded-2xl shadow-sm p-4 sticky top-20 self-start">
    <nav class="flex flex-col gap-1">
      <a href="/dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z" /></svg>
        My Posts
      </a>
      <a href="/favorite-page.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M6 4h12v16l-6-4-6 4V4z" /></svg>
        Bookmarks
      </a>
      <a href="/history-page.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 8v4l3 2" /></svg>
        Recently Viewed
      </a>
      <a href="/settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold bg-secondary2/10 text-secondary2">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        Settings
      </a>
    </nav>
    <div class="mt-4 pt-4 border-t border-gray-100">
      <button type="button" id="sidebarLogoutBtn" class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-semibold text-red-600 hover:bg-red-50 w-full">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" /></svg>
        Log out
      </button>
    </div>
  </aside>

  <div class="md:flex-1 md:min-w-0">
    <div class="grid grid-cols-1 md:grid-cols-[220px_1fr] gap-12">

      <!-- Left column: avatar + username -->
      <div class="flex flex-col">
        <div class="relative w-36 h-36">
          <div class="w-36 h-36 rounded-full bg-gray-300 overflow-hidden flex items-center justify-center">
            <span id="avatarInitials" class="w-full h-full flex items-center justify-center text-white text-4xl font-bold"></span>
            <img id="avatarPreview" class="hidden w-full h-full object-cover" alt="Your avatar">
          </div>
          <div id="avatarUploadSpinner" class="hidden absolute inset-0 w-36 h-36 rounded-full bg-black/40 flex items-center justify-center">
            <svg class="animate-spin h-6 w-6 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
          </div>
          <label for="avatar-upload" class="absolute bottom-1 right-1 w-8 h-8 rounded-full bg-gray-900 flex items-center justify-center cursor-pointer hover:bg-gray-700">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 9a2 2 0 012-2h1.586a1 1 0 00.707-.293l1.414-1.414A1 1 0 019.414 5h5.172a1 1 0 01.707.293l1.414 1.414A1 1 0 0017.414 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <input id="avatar-upload" type="file" accept="image/png,image/jpeg,image/gif" class="hidden" />
          </label>
        </div>

        <div class="mt-14">
          <label for="username" class="block text-sm font-bold text-gray-900 mb-2">Username</label>
          <input id="username" type="text" placeholder="username" readonly
                 class="w-full rounded-full bg-gray-100 border-0 text-sm text-gray-500 placeholder-gray-500 px-5 py-3 cursor-not-allowed" />
          <p class="text-xs text-gray-400 mt-1.5">Username can't be changed.</p>
        </div>
      </div>

      <!-- Right column: personal info form -->
      <div>
        <h1 class="text-center text-lg font-bold text-gray-900 mb-8">Personal info</h1>

        <form class="space-y-6">

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div>
              <label for="last-name" class="block text-sm font-bold text-gray-900 mb-2">Last name</label>
              <input id="last-name" type="text" placeholder="Your last name"
                     class="w-full rounded-full bg-gray-200 border-0 text-sm text-gray-500 placeholder-gray-500 px-5 py-3 focus:ring-2 focus:ring-gray-400 focus:bg-gray-100" />
            </div>
            <div>
              <label for="first-name" class="block text-sm font-bold text-gray-900 mb-2">First name</label>
              <input id="first-name" type="text" placeholder="Your first name"
                     class="w-full rounded-full bg-gray-200 border-0 text-sm text-gray-500 placeholder-gray-500 px-5 py-3 focus:ring-2 focus:ring-gray-400 focus:bg-gray-100" />
            </div>
          </div>

          <div>
            <label for="email" class="block text-sm font-bold text-gray-900 mb-2">Email</label>
            <input id="email" type="email" placeholder="Email@gmail.com" readonly
                   class="w-full rounded-full bg-gray-100 border-0 text-sm text-gray-500 placeholder-gray-500 px-5 py-3 cursor-not-allowed" />
            <p class="text-xs text-gray-400 mt-1.5">Email can't be changed here.</p>
          </div><div>
            <label for="password" class="block text-sm font-bold text-gray-900 mb-2">Change password</label>
            <div class="relative">
              <input id="password" type="password" placeholder="Leave blank to keep current password"
                     class="w-full rounded-full bg-gray-200 border-0 text-sm text-gray-500 placeholder-gray-500 px-5 py-3 pr-12 focus:ring-2 focus:ring-gray-400 focus:bg-gray-100" />
              <button type="button" id="toggle-password"
                      class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-600 hover:text-gray-900">
                <svg id="eye-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <svg id="eye-closed" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              </button>
            </div>
          </div>

          <div id="saveAlert" class="hidden text-center text-sm rounded-lg px-4 py-2"></div>

          <div class="flex justify-center gap-3 pt-4">
            <button type="submit" id="saveProfileBtn"
                    class="inline-flex items-center gap-2 rounded-full bg-[#564CE5] hover:bg-[#4338CA] text-white text-sm font-semibold px-8 py-3 disabled:opacity-60">
              <span id="saveProfileLabel">Save</span>
            </button>
            <button type="button" id="logoutBtn"
                    class="inline-flex items-center gap-2 rounded-full bg-gray-200 hover:bg-gray-300 text-gray-900 text-sm font-semibold px-8 py-3">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" />
              </svg>
              Log out
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>
  </div>
<script src="../vendor/flowbite/flowbite.min.js"> </script>
    <script src="../vendor/preline/preline.js"></script>
    <!-- STADIA API wiring -->
    <script src="../vendor/multiavatar/multiavatar.min.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/users.js"></script>
    <script src="../js/media.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        [document.getElementById('sidebarLogoutBtn'), document.getElementById('navProfileLogout')].forEach(btn => {
          if (btn) btn.addEventListener('click', () => { if (window.AuthAPI) AuthAPI.logout(); });
        });
        const navProfileBtn = document.getElementById('navProfileBtn');
        const navProfileMenu = document.getElementById('navProfileMenu');
        if (navProfileBtn && navProfileMenu) {
          navProfileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = !navProfileMenu.classList.contains('hidden');
            navProfileMenu.classList.toggle('hidden', isOpen);
            navProfileBtn.setAttribute('aria-expanded', String(!isOpen));
          });
          document.addEventListener('click', () => {
            navProfileMenu.classList.add('hidden');
            navProfileBtn.setAttribute('aria-expanded', 'false');
          });
        }

        const form = document.querySelector('form');
        const saveAlert = document.getElementById('saveAlert');
        const saveBtn = document.getElementById('saveProfileBtn');
        const saveLabel = document.getElementById('saveProfileLabel');
        const avatarPreview = document.getElementById('avatarPreview');
        const avatarUploadInput = document.getElementById('avatar-upload');
        const avatarUploadSpinner = document.getElementById('avatarUploadSpinner');

        const showAlert = (message, isError) => {
          if (!saveAlert) return;
          saveAlert.textContent = message;
          saveAlert.classList.remove('hidden', 'text-red-600', 'bg-red-50', 'text-emerald-700', 'bg-emerald-50');
          saveAlert.classList.add(isError ? 'text-red-600' : 'text-emerald-700', isError ? 'bg-red-50' : 'bg-emerald-50');
        };

        const avatarInitials = document.getElementById('avatarInitials');
        const setAvatarPreview = (filenameOrUrl, userForFallback) => {
          if (!filenameOrUrl || !avatarPreview) {
            if (avatarPreview) avatarPreview.classList.add('hidden');
            // No photo set -- show the same generated-avatar fallback used in the navbar
            // (rendered onto the span only, leaving the sibling <img> intact for later uploads).
            if (avatarInitials && window.AuthAPI) {
              avatarInitials.classList.remove('hidden');
              AuthAPI.renderUserAvatar(avatarInitials, userForFallback);
            }
            return;
          }
          if (avatarInitials) avatarInitials.classList.add('hidden');
          avatarPreview.src = window.MediaAPI ? MediaAPI.getMediaUrl(filenameOrUrl) : filenameOrUrl;
          avatarPreview.classList.remove('hidden');
        };

        // Load the currently logged-in user's data into the form (if authenticated)
        try {
          const user = await UsersAPI.getCurrentUser();
          if (user) {
            const set = (el, v) => { if (el) el.value = v || ''; };
            set(document.getElementById('username'), user.username);
            set(document.getElementById('first-name'), user.given_name || user.first_name);
            set(document.getElementById('last-name'), user.family_name || user.last_name);
            set(document.getElementById('email'), user.email);
            setAvatarPreview(user.avatar, user);

            const navProfileName = document.getElementById('navProfileName');
            const displayName = (user.given_name || user.username)
              ? `${user.given_name || ''} ${user.family_name || ''}`.trim() || user.username
              : 'Account';
            if (navProfileName) navProfileName.textContent = displayName;
            if (window.AuthAPI) AuthAPI.renderUserAvatar(document.getElementById('navProfileAvatar'), user);
          }
        } catch (e) {
          console.warn('Could not load current user:', e.message);
          showAlert('You are not logged in — sign in to edit your profile.', true);
        }

        // Avatar upload: pick a file -> upload to /media -> save the returned
        // filename on the user's profile via PATCH /users/me (avatar is a real
        // field there, confirmed via the live OpenAPI schema).
        if (avatarUploadInput) {
          avatarUploadInput.addEventListener('change', async () => {
            const file = avatarUploadInput.files && avatarUploadInput.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
              showAlert('Please choose an image file (PNG, JPG, GIF).', true);
              avatarUploadInput.value = '';
              return;
            }
            if (saveAlert) saveAlert.classList.add('hidden');
            if (avatarUploadSpinner) avatarUploadSpinner.classList.remove('hidden');
            try {
              const media = await MediaAPI.uploadFile(file);
              const filename = (media && (media.filename || media.url || media.path)) || '';
              if (!filename) throw new Error('Upload succeeded but no file path was returned.');
              await UsersAPI.updateCurrentUser({ avatar: filename });
              setAvatarPreview(filename);
              showAlert('Profile photo updated.', false);
            } catch (err) {
              showAlert('Could not upload photo: ' + (err.message || 'unknown error'), true);
            } finally {
              if (avatarUploadSpinner) avatarUploadSpinner.classList.add('hidden');
              avatarUploadInput.value = '';
            }
          });
        }

        // Save profile changes
        if (form) {
          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (saveAlert) saveAlert.classList.add('hidden');
            saveBtn.disabled = true;
            saveLabel.textContent = 'Saving...';
            try {
              // Only given_name/family_name (and avatar, handled separately above)
              // are real fields on UpdateUserRequest -- username/email aren't
              // editable through this endpoint (confirmed via the live API), so
              // those inputs are read-only and intentionally not sent here.
              await UsersAPI.updateCurrentUser({
                given_name: document.getElementById('first-name').value.trim(),
                family_name: document.getElementById('last-name').value.trim(),
              });
              // Password change is intentionally not sent here: the API requires the
              // current password (PATCH /users/me/password expects current_password +
              // new_password) and this form only collects a new password, so changing
              // it would either silently fail or require guessing the current one.
              const pwValue = document.getElementById('password').value;
              if (pwValue) {
                showAlert('Profile saved. Password change requires re-entering your current password (not supported on this form yet) — password was not updated.', true);
              } else {
                showAlert('Profile saved successfully.', false);
              }
            } catch (err) {
              showAlert(err.message || 'Failed to save profile. Please try again.', true);
            } finally {
              saveBtn.disabled = false;
              saveLabel.textContent = 'Save';
            }
          });
        }

        // Wire the Log out button
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
          logoutBtn.addEventListener('click', () => {
            AuthAPI.logout();
          });
        }

        // Toggle password visibility
        const toggle = document.getElementById('toggle-password');
        const pw = document.getElementById('password');
        const open = document.getElementById('eye-open');
        const closed = document.getElementById('eye-closed');
        if (toggle && pw && open && closed) {
          toggle.addEventListener('click', () => {
            const show = pw.type === 'password';
            pw.type = show ? 'text' : 'password';
            open.classList.toggle('hidden', show);
            closed.classList.toggle('hidden', !show);
          });
        }
      });
    </script>
</body>
</html>
