<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>View History</title>
<meta name="description" content="Your recently viewed STADIA projects.">
<meta name="robots" content="noindex, nofollow">
<script>(function(){try{var t=localStorage.getItem('stadia_theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}if(t==='dark')document.documentElement.classList.add('dark');}catch(e){}})();</script>

<body class="bg-gray-100 min-h-screen">

<!-- Account-area navbar: logo (-> home) + profile dropdown (Dashboard,
     Settings, Log out) + dark mode toggle. Shared across dashboard.html,
     favorite-page.html, history-page.html and settings.html. -->

        <svg class="theme-icon-moon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">

        </svg>
      </button>
      <div class="relative">

          <span id="navProfileAvatar" class="w-8 h-8 rounded-full bg-gray-300 overflow-hidden flex items-center justify-center text-white text-xs font-bold shrink-0"></span>

          <a href="/favorite-page.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Bookmarks</a>
          <a href="/history-page.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Recently Viewed</a>
          <a href="/settings.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Settings</a>
          <div class="border-t border-gray-100 my-1"></div>
          <button type="button" id="navProfileLogout" class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">Log out</button>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="max-w-6xl mx-auto py-6 px-4 md:flex md:items-start md:gap-6">

  <!-- Desktop sidebar (mobile keeps the compact icon-pill-row below instead) -->
  <aside class="hidden md:flex md:flex-col w-60 shrink-0 bg-white rounded-2xl shadow-sm p-4 sticky top-20 self-start">
    <nav class="flex flex-col gap-1">
      <a href="/dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z" /></svg>
        My Posts
      </a>
      <a href="/favorite-page.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M6 4h12v16l-6-4-6 4V4z" /></svg>
        Bookmarks
      </a>
      <a href="/history-page.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold bg-secondary2/10 text-secondary2">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 8v4l3 2" /></svg>
        Recently Viewed
      </a>
      <a href="/settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        Settings
      </a>
    </nav>
    <div class="mt-4 pt-4 border-t border-gray-100">
      <button type="button" id="sidebarLogoutBtn" class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-semibold text-red-600 hover:bg-red-50 w-full">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" /></svg>
        Log out
      </button>
    </div>
  </aside>

  <div class="md:flex-1 md:min-w-0">

    <!-- Profile header (real logged-in user) -->
    <div class="flex items-start gap-5 mb-6">
      <span id="profileAvatar" class="w-24 h-24 rounded-full bg-gray-300 overflow-hidden flex items-center justify-center text-white text-3xl font-bold shrink-0"></span>

      <div class="flex-1 pt-1">
        <h1 id="profileName" class="text-xl font-bold text-gray-900">Loading...</h1>
        <p id="profileUsername" class="text-sm text-gray-500 mt-0.5"></p>
      </div>
    </div>

    <!-- Tabs (mobile only -- desktop uses the sidebar instead) -->
    <div class="md:hidden flex items-center bg-gray-200 rounded-xl p-1 mb-8">
      <a href="/history-page.html" class="flex-1 flex items-center justify-center py-2.5 rounded-lg bg-white shadow-sm" title="View History">
        <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 8v4l3 2" />
        </svg>
      </a>
      <a href="/favorite-page.html" class="flex-1 flex items-center justify-center py-2.5 rounded-lg text-gray-500 hover:text-gray-700" title="Favorites">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M6 4h12v16l-6-4-6 4V4z" />
        </svg>
      </a>
      <a href="/dashboard.html" class="flex-1 flex items-center justify-center py-2.5 rounded-lg text-gray-500 hover:text-gray-700" title="My Dashboard">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z" />
        </svg>
      </a>
    </div>

    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold text-gray-900">Recently Viewed</h2>
      <button type="button" id="clearHistoryBtn" class="hidden text-sm font-semibold text-red-600 hover:underline">Clear all</button>
    </div>

    <!-- Not logged in -->
    <div id="auth-required" class="hidden text-sm text-gray-600 py-8 text-center border border-dashed border-gray-300 rounded-xl">
      Please <a href="/login.html" class="text-[#564CE5] font-semibold hover:underline">sign in</a> to see your view history.
    </div>

    <!-- Loading state -->
    <div id="loading-state" class="text-sm text-gray-500 py-8 text-center">
      Loading history...
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-sm text-gray-500 py-8 text-center border border-dashed border-gray-300 rounded-xl">
      No projects viewed yet. <a href="/projects.html" class="text-[#564CE5] font-semibold hover:underline">Browse projects</a> to build up your history.
    </div>

    <!-- Cards render here -->
    <div id="activity-grid" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>

  </div>
  </div>

  <template id="historyCardTemplate">
    <div class="bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 flex flex-col" data-project-uuid="">
      <a class="card-link relative bg-gray-100 h-32 flex items-center justify-center" href="#">
        <img class="card-thumb hidden w-full h-32 object-cover" alt="" />
      </a>
      <div class="p-3 flex-1 flex flex-col">
        <a class="card-link" href="#">
          <p class="card-title text-sm font-semibold text-gray-900 mb-1 line-clamp-1"></p>
        </a>
        <p class="card-viewed text-xs text-gray-400 mb-3"></p>
        <button type="button" class="card-remove mt-auto self-start px-2 py-1.5 text-xs font-semibold rounded-md border border-gray-200 text-gray-600 hover:bg-gray-50">Remove</button>
      </div>
    </div>
  </template>

    <script src="../vendor/flowbite/flowbite.min.js"> </script>
    <script src="../vendor/preline/preline.js"></script>
    <!-- STADIA API wiring -->
    <script src="../vendor/multiavatar/multiavatar.min.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/media.js"></script>
    <script src="../js/project.js"></script>
    <script src="../js/users.js"></script>
    <script src="../js/favorites.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        [document.getElementById('sidebarLogoutBtn'), document.getElementById('navProfileLogout')].forEach(btn => {
          if (btn) btn.addEventListener('click', () => { if (window.AuthAPI) AuthAPI.logout(); });
        });
        const navProfileBtn = document.getElementById('navProfileBtn');
        const navProfileMenu = document.getElementById('navProfileMenu');
        if (navProfileBtn && navProfileMenu) {
          navProfileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = !navProfileMenu.classList.contains('hidden');
            navProfileMenu.classList.toggle('hidden', isOpen);
            navProfileBtn.setAttribute('aria-expanded', String(!isOpen));
          });
          document.addEventListener('click', () => {
            navProfileMenu.classList.add('hidden');
            navProfileBtn.setAttribute('aria-expanded', 'false');
          });
        }

        const grid = document.getElementById('activity-grid');
        const loading = document.getElementById('loading-state');
        const empty = document.getElementById('empty-state');
        const authRequired = document.getElementById('auth-required');
        const clearBtn = document.getElementById('clearHistoryBtn');
        const template = document.getElementById('historyCardTemplate');

        if (!window.AuthAPI || !AuthAPI.isAuthenticated()) {
          loading.classList.add('hidden');
          authRequired.classList.remove('hidden');
          return;
        }

        try {
          const user = await UsersAPI.getCurrentUser();
          if (user) {
            const displayName = user.given_name
              ? `${user.given_name} ${user.family_name || ''}`.trim() : (user.username || 'Account');
            document.getElementById('profileName').textContent = displayName;
            document.getElementById('profileUsername').textContent = user.username ? '@' + user.username : '';
            if (window.AuthAPI) AuthAPI.renderUserAvatar(document.getElementById('profileAvatar'), user);

            const navProfileName = document.getElementById('navProfileName');
            if (navProfileName) navProfileName.textContent = displayName;
            if (window.AuthAPI) AuthAPI.renderUserAvatar(document.getElementById('navProfileAvatar'), user);
          }
        } catch (e) { /* profile header is cosmetic; ignore failures */ }

        function timeAgo(iso) {
          const diffMs = Date.now() - new Date(iso).getTime();
          const mins = Math.round(diffMs / 60000);
          if (mins < 1) return 'Just now';
          if (mins < 60) return `${mins}m ago`;
          const hours = Math.round(mins / 60);
          if (hours < 24) return `${hours}h ago`;
          const days = Math.round(hours / 24);
          if (days < 30) return `${days}d ago`;
          return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function renderCard(entry) {
          const node = template.content.firstElementChild.cloneNode(true);
          node.dataset.projectUuid = entry.uuid;

          const links = node.querySelectorAll('.card-link');
          links.forEach(a => a.href = '/project-detail.html?id=' + encodeURIComponent(entry.uuid));

          const thumb = node.querySelector('.card-thumb');
          const thumbUrl = window.MediaAPI ? MediaAPI.getMediaUrl(entry.thumbnail) : '';
          if (thumbUrl) {
            thumb.src = thumbUrl;
            thumb.alt = entry.title || '';
            thumb.classList.remove('hidden');
          }

          node.querySelector('.card-title').textContent = entry.title || 'Untitled project';
          node.querySelector('.card-viewed').textContent = 'Viewed ' + timeAgo(entry.viewedAt);

          node.querySelector('.card-remove').addEventListener('click', async () => {
            const ok = window.showConfirmModal
              ? await showConfirmModal('Remove this project from your history?', { confirmLabel: 'Remove', danger: true })
              : confirm('Remove this project from your history?');
            if (!ok) return;
            HistoryAPI.remove(entry.uuid);
            node.remove();
            if (!HistoryAPI.getAll().length) renderList();
          });

          return node;
        }

        function renderList() {
          const items = HistoryAPI.getAll();
          loading.classList.add('hidden');
          if (!items.length) {
            empty.classList.remove('hidden');
            grid.classList.add('hidden');
            clearBtn.classList.add('hidden');
            return;
          }
          grid.innerHTML = '';
          items.forEach(entry => grid.appendChild(renderCard(entry)));
          empty.classList.add('hidden');
          grid.classList.remove('hidden');
          clearBtn.classList.remove('hidden');
        }

        clearBtn.addEventListener('click', async () => {
          const ok = window.showConfirmModal
            ? await showConfirmModal('Clear your entire view history? This cannot be undone.', { confirmLabel: 'Clear all', danger: true })
            : confirm('Clear your entire view history?');
          if (!ok) return;
          HistoryAPI.clear();
          renderList();
        });

        renderList();
      });
    </script>
  </body>
  </html>
