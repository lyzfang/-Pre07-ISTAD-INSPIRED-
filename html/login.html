<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In | STADIA</title>
<meta name="description" content="Sign in to your STADIA account to manage your projects.">
<meta property="og:type" content="website">
<meta property="og:title" content="Sign In | STADIA">
<meta property="og:description" content="Sign in to your STADIA account to manage your projects.">
<meta property="og:image" content="../image/stadia-logo-transparent.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sign In | STADIA">
<meta name="twitter:description" content="Sign in to your STADIA account to manage your projects.">
<script>(function(){try{var t=localStorage.getItem('stadia_theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}if(t==='dark')document.documentElement.classList.add('dark');}catch(e){}})();</script>
<link rel="stylesheet" href="../vendor/flowbite/flowbite.min.css">
<link rel="stylesheet" href="../src/output.css">
<style>
  .auth-blob {
    position: absolute;
    border-radius: 9999px;
    filter: blur(70px);
    opacity: 0.35;
    animation: auth-blob-float 20s ease-in-out infinite;
    pointer-events: none;
  }
  .auth-blob-1 { width: 380px; height: 380px; background: #564CE5; top: -100px; left: -100px; }
  .auth-blob-2 { width: 320px; height: 320px; background: #FFD400; top: 45%; right: -120px; animation-delay: -7s; }
  .auth-blob-3 { width: 280px; height: 280px; background: #22D3EE; bottom: -120px; left: 25%; animation-delay: -14s; }
  @keyframes auth-blob-float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -40px) scale(1.1); }
    66% { transform: translate(-25px, 30px) scale(0.95); }
  }
  .dark .auth-blob { opacity: 0.16; }
  @media (prefers-reduced-motion: reduce) {
    .auth-blob { animation: none; }
  }
</style>
</head>
<body class="relative bg-gray-50 m-0 p-0 overflow-hidden h-screen">

  <div class="absolute inset-0 overflow-hidden" aria-hidden="true">
    <div class="auth-blob auth-blob-1"></div>
    <div class="auth-blob auth-blob-2"></div>
    <div class="auth-blob auth-blob-3"></div>
  </div>

  <div class="relative flex items-center justify-center w-full h-full px-4">
    <div class="w-full max-w-sm">

      <div class="flex items-center justify-between mb-4">
        <a href="/index.html" class="inline-flex items-center gap-2 text-xs font-semibold text-gray-900 hover:text-gray-600 transition-colors">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          Back To Home
        </a>
        <button type="button" data-action="toggle-theme" title="Toggle dark mode" class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-gray-200 text-gray-700">
          <svg class="theme-icon-sun w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m8.66-9h-1M4.34 12h-1m14.14 6.66l-.7-.7M7.05 7.05l-.7-.7m11.32 0l-.7.7M7.05 16.95l-.7.7M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg class="theme-icon-moon w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </div>

      <div class="bg-white border border-gray-200 rounded-3xl shadow-sm px-6 py-8">

        <div class="flex justify-center mb-4">
          <a href="/index.html">
            <img src="../image/stadia-logo-transparent.png" alt="STADIA" class="h-12 w-auto">
          </a>
        </div>

        <h1 class="text-center text-base font-bold text-gray-900 mb-6">Sign In</h1>

        <div id="successBanner" class="hidden mb-4 text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2">Account created successfully. Please sign in.</div>
        <div id="formAlert" class="hidden mb-4 text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>

        <form id="loginForm" class="space-y-3">
          <div>
            <label for="loginIdentifier" class="block text-xs font-semibold text-gray-900 mb-1">Username or Email</label>
            <input type="text" id="loginIdentifier" placeholder="Enter your username or email" autocomplete="username"
              class="w-full rounded-xl border border-gray-200 py-2 px-3 text-xs text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:border-gray-400" />
          </div>
          <div>
            <label for="loginPassword" class="block text-xs font-semibold text-gray-900 mb-1">Password</label>
            <div class="relative">
              <input type="password" id="loginPassword" placeholder="Enter your Password" autocomplete="current-password"
                class="w-full rounded-xl border border-gray-200 py-2 pl-3 pr-9 text-xs text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:border-gray-400" />
              <button type="button" class="toggle-password absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-800" aria-label="Show password" tabindex="-1">
                <svg class="icon-eye w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <svg class="icon-eye-off w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              </button>
            </div>
          </div>
          <button type="submit" id="loginSubmitBtn"
            class="w-full flex items-center justify-center gap-2 text-center bg-secondary2 text-white rounded-xl py-2 px-3 text-xs font-semibold hover:opacity-90 transition-colors disabled:opacity-60">
            <svg id="loginSubmitSpinner" class="hidden animate-spin h-3.5 w-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span id="loginSubmitLabel">Sign In</span>
          </button>
          <p class="text-center text-xs text-gray-500">Don't have an account?
            <a href="/signup.html" id="signupLink" class="text-secondary2 font-semibold hover:underline">Sign Up</a>
          </p>
        </form>

      </div>
    </div>
  </div>

  <script src="../vendor/flowbite/flowbite.min.js"> </script>
    <script src="../vendor/preline/preline.js"></script>
    <!-- STADIA API wiring -->
    <script src="../vendor/multiavatar/multiavatar.min.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // `redirect` carries the page the user was trying to reach before
        // being sent here (e.g. Post Creator) -- see AuthAPI.redirectToLogin().
        // With no redirect, a normal sign-in lands on the user's dashboard.
        const redirectParam = new URLSearchParams(window.location.search).get('redirect');
        const destination = redirectParam ? decodeURIComponent(redirectParam) : './dashboard.html';

        const signUpLink = document.getElementById('signUpLink');
        if (redirectParam) {
          signUpLink.href = '/signup.html?redirect=' + encodeURIComponent(redirectParam);
        }

        // If already logged in, no reason to be here.
        if (window.AuthAPI && AuthAPI.isAuthenticated()) {
          window.location.href = destination;
          return;
        }

        const loginForm = document.getElementById('loginForm');
        const formAlert = document.getElementById('formAlert');
        const successBanner = document.getElementById('successBanner');
        const loginIdentifier = document.getElementById('loginIdentifier');
        const loginPassword = document.getElementById('loginPassword');
        const loginSubmitBtn = document.getElementById('loginSubmitBtn');
        const loginSubmitLabel = document.getElementById('loginSubmitLabel');
        const loginSubmitSpinner = document.getElementById('loginSubmitSpinner');

        // Arrived here right after a successful sign-up (see signup.html)
        if (new URLSearchParams(window.location.search).get('registered') === '1') {
          successBanner.classList.remove('hidden');
        }

        // Show/hide password toggle
        document.querySelectorAll('.toggle-password').forEach(btn => {
          const input = btn.parentElement.querySelector('input');
          const eyeOpen = btn.querySelector('.icon-eye');
          const eyeOff = btn.querySelector('.icon-eye-off');
          btn.addEventListener('click', () => {
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            eyeOpen.classList.toggle('hidden', show);
            eyeOff.classList.toggle('hidden', !show);
          });
        });

        function showAlert(message) {
          formAlert.textContent = message;
          formAlert.classList.remove('hidden');
        }

        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          formAlert.classList.add('hidden');
          if (!loginIdentifier.value.trim() || !loginPassword.value) {
            showAlert('Please enter your username/email and password.');
            return;
          }
          loginSubmitBtn.disabled = true;
          loginSubmitSpinner.classList.remove('hidden');
          loginSubmitLabel.textContent = 'Signing in...';
          try {
            await AuthAPI.login(loginIdentifier.value.trim(), loginPassword.value);
            if (window.ApiUtils) ApiUtils.showSuccess('Welcome back!');
            window.location.href = destination;
          } catch (err) {
            const message = err.message || 'Login failed. Please check your credentials.';
            showAlert(message);
            if (window.ApiUtils) ApiUtils.showError(message);
          } finally {
            loginSubmitBtn.disabled = false;
            loginSubmitSpinner.classList.add('hidden');
            loginSubmitLabel.textContent = 'Sign In';
          }
        });
      });
    </script>
</body>
</html>
