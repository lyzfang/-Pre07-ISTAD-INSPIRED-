    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        if (window.AuthAPI) AuthAPI.initNavAuth();

        [document.getElementById('sidebarLogoutBtn'), document.getElementById('navProfileLogout')].forEach(btn => {
          if (btn) btn.addEventListener('click', () => { if (window.AuthAPI) AuthAPI.logout(); });
        });

        // Navbar profile dropdown (logo -> home is a plain link, needs no JS)
        const navProfileBtn = document.getElementById('navProfileBtn');
        const navProfileMenu = document.getElementById('navProfileMenu');
        if (navProfileBtn && navProfileMenu) {
          navProfileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = !navProfileMenu.classList.contains('hidden');
            navProfileMenu.classList.toggle('hidden', isOpen);
            navProfileBtn.setAttribute('aria-expanded', String(!isOpen));
          });
          document.addEventListener('click', () => {
            navProfileMenu.classList.add('hidden');
            navProfileBtn.setAttribute('aria-expanded', 'false');
          });
        }

        const grid = document.getElementById('activity-grid');
        const loading = document.getElementById('loading-state');
        const empty = document.getElementById('empty-state');
        const authRequired = document.getElementById('auth-required');
        const template = document.getElementById('dashboardCardTemplate');
        const tableWrap = document.getElementById('activity-table-wrap');
        const tableBody = document.getElementById('activity-table-body');
        const tableRowTemplate = document.getElementById('dashboardTableRowTemplate');
        const viewToggle = document.getElementById('viewToggle');
        const viewToggleCards = document.getElementById('viewToggleCards');
        const viewToggleTable = document.getElementById('viewToggleTable');

        // Card view is fine for a handful of projects, but doesn't scale --
        // a table view lets a user with many projects scan/act on them
        // without endless scrolling. Preference persists across visits.
        function setView(mode) {
          localStorage.setItem('stadia_dashboard_view', mode);
          const isTable = mode === 'table';
          grid.classList.toggle('hidden', isTable || !grid.querySelector('[data-project-uuid]'));
          tableWrap.classList.toggle('hidden', !isTable || !tableBody.querySelector('[data-project-uuid]'));
          viewToggleCards.classList.toggle('bg-white', !isTable);
          viewToggleCards.classList.toggle('shadow-sm', !isTable);
          viewToggleCards.classList.toggle('text-gray-800', !isTable);
          viewToggleCards.classList.toggle('text-gray-500', isTable);
          viewToggleTable.classList.toggle('bg-white', isTable);
          viewToggleTable.classList.toggle('shadow-sm', isTable);
          viewToggleTable.classList.toggle('text-gray-800', isTable);
          viewToggleTable.classList.toggle('text-gray-500', !isTable);
        }
        if (viewToggleCards) viewToggleCards.addEventListener('click', () => setView('cards'));
        if (viewToggleTable) viewToggleTable.addEventListener('click', () => setView('table'));

        let mine = []; // the current user's own projects, populated below

        if (!window.AuthAPI || !AuthAPI.isAuthenticated()) {
          loading.classList.add('hidden');
          authRequired.classList.remove('hidden');
          return;
        }

        function escapeHtml(str) {
          return window.ApiUtils ? window.ApiUtils.escapeHTML(str) : (str || '');
        }

        function renderCard(project) {
          const node = template.content.firstElementChild.cloneNode(true);
          node.dataset.projectUuid = project.uuid;

          const thumb = node.querySelector('.card-thumb');
          const thumbUrl = window.MediaAPI ? MediaAPI.getMediaUrl(project.thumbnail) : '';
          if (thumbUrl) {
            thumb.src = thumbUrl;
            thumb.alt = project.title || '';
            thumb.classList.remove('hidden');
          }

          const statusBadge = node.querySelector('.card-status');
          const status = (project.status || 'draft').toLowerCase();
          statusBadge.textContent = status;
          statusBadge.className = 'card-status absolute top-2 left-2 px-2 py-0.5 rounded-full text-[10px] font-semibold uppercase ' +
            (status === 'published' ? 'bg-emerald-100 text-emerald-700' : 'bg-gray-200 text-gray-600');

          node.querySelector('.card-title').textContent = project.title || 'Untitled';
          node.querySelector('.card-desc').textContent = project.description || project.summary || '';

          const editLink = node.querySelector('.card-edit');
          editLink.href = `create-project.html?id=${project.uuid}`;
          editLink.addEventListener('click', (e) => e.stopPropagation());

          const toggleBtn = node.querySelector('.card-toggle-status');
          toggleBtn.textContent = status === 'published' ? 'Unpublish' : 'Publish';
          toggleBtn.addEventListener('click', () => toggleProjectStatus(project, status, toggleBtn));

          const deleteBtn = node.querySelector('.card-delete');
          deleteBtn.addEventListener('click', () => deleteProjectEverywhere(project, deleteBtn));

          // Clicking the thumbnail/title (not the action buttons) opens the project
          node.addEventListener('click', (e) => {
            if (e.target.closest('button')) return;
            window.location.href = `project-detail.html?id=${project.uuid}`;
          });
          node.style.cursor = 'pointer';

          return node;
        }

        // Table view: same data/actions as renderCard, laid out as a row --
        // scales better than a card grid once a user has many projects.
        function renderTableRow(project) {
          const node = tableRowTemplate.content.firstElementChild.cloneNode(true);
          node.dataset.projectUuid = project.uuid;

          const thumbImg = node.querySelector('.row-thumb-img');
          const thumbUrl = window.MediaAPI ? MediaAPI.getMediaUrl(project.thumbnail) : '';
          if (thumbUrl) {
            thumbImg.src = thumbUrl;
            thumbImg.alt = project.title || '';
            thumbImg.classList.remove('hidden');
          }

          const status = (project.status || 'draft').toLowerCase();
          const statusBadge = node.querySelector('.row-status');
          statusBadge.textContent = status;
          statusBadge.className = 'row-status px-2 py-0.5 rounded-full text-[10px] font-semibold uppercase ' +
            (status === 'published' ? 'bg-emerald-100 text-emerald-700' : 'bg-gray-200 text-gray-600');

          node.querySelector('.row-title').textContent = project.title || 'Untitled';
          node.querySelector('.row-desc').textContent = project.description || project.summary || '';

          const editLink = node.querySelector('.row-edit');
          editLink.href = `create-project.html?id=${project.uuid}`;

          const toggleBtn = node.querySelector('.row-toggle-status');
          toggleBtn.textContent = status === 'published' ? 'Unpublish' : 'Publish';
          toggleBtn.addEventListener('click', () => { closeAllRowMenus(); toggleProjectStatus(project, status, toggleBtn); });

          const deleteBtn = node.querySelector('.row-delete');
          deleteBtn.addEventListener('click', () => { closeAllRowMenus(); deleteProjectEverywhere(project, deleteBtn); });

          // Actions dropdown: a single "..." trigger per row instead of 3
          // buttons crowding the table -- only one menu open at a time.
          const menuTrigger = node.querySelector('.row-actions-trigger');
          const menuPanel = node.querySelector('.row-actions-panel');
          menuTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = !menuPanel.classList.contains('hidden');
            closeAllRowMenus();
            if (!isOpen) {
              menuPanel.classList.remove('hidden');
              menuTrigger.setAttribute('aria-expanded', 'true');
            }
          });
          editLink.addEventListener('click', () => closeAllRowMenus());

          return node;
        }

        function closeAllRowMenus() {
          document.querySelectorAll('.row-actions-panel').forEach(p => p.classList.add('hidden'));
          document.querySelectorAll('.row-actions-trigger').forEach(t => t.setAttribute('aria-expanded', 'false'));
        }
        document.addEventListener('click', closeAllRowMenus);

        // Shared by both views so a status change or delete made from either
        // the card grid or the table stays in sync in the other.
        async function toggleProjectStatus(project, currentStatus, triggerBtn) {
          const nextStatus = currentStatus === 'published' ? 'draft' : 'published';
          const confirmMessage = nextStatus === 'published'
            ? `Publish "${project.title || 'this project'}"? It will become visible to everyone.`
            : `Unpublish "${project.title || 'this project'}"? It will go back to draft.`;
          const confirmed = window.showConfirmModal
            ? await showConfirmModal(confirmMessage, { confirmLabel: nextStatus === 'published' ? 'Publish' : 'Unpublish', danger: false })
            : confirm(confirmMessage);
          if (!confirmed) return;
          triggerBtn.disabled = true;
          const original = triggerBtn.textContent;
          triggerBtn.textContent = '...';
          try {
            await ProjectsAPI.updateStatus(project.uuid, nextStatus);
            project.status = nextStatus;
            grid.querySelectorAll(`[data-project-uuid="${project.uuid}"]`).forEach(n => n.replaceWith(renderCard(project)));
            tableBody.querySelectorAll(`[data-project-uuid="${project.uuid}"]`).forEach(n => n.replaceWith(renderTableRow(project)));
            document.getElementById('stat-published').textContent = mine.filter(p => (p.status || '').toLowerCase() === 'published').length;
            document.getElementById('stat-draft').textContent = mine.filter(p => (p.status || '').toLowerCase() !== 'published').length;
            if (window.ApiUtils) ApiUtils.showSuccess(`"${project.title || 'Project'}" is now ${nextStatus}.`);
          } catch (err) {
            const message = 'Could not update status: ' + (err.message || 'unknown error');
            if (window.ApiUtils) ApiUtils.showError(message);
            triggerBtn.disabled = false;
            triggerBtn.textContent = original;
          }
        }

        async function deleteProjectEverywhere(project, triggerBtn) {
          const confirmed = window.showConfirmModal
            ? await showConfirmModal(`Delete "${project.title || 'this project'}"? This cannot be undone.`, { confirmLabel: 'Delete' })
            : confirm(`Delete "${project.title || 'this project'}"? This cannot be undone.`);
          if (!confirmed) return;
          triggerBtn.disabled = true;
          triggerBtn.textContent = 'Deleting...';
          try {
            await ProjectsAPI.deleteProject(project.uuid);
            grid.querySelectorAll(`[data-project-uuid="${project.uuid}"]`).forEach(n => n.remove());
            tableBody.querySelectorAll(`[data-project-uuid="${project.uuid}"]`).forEach(n => n.remove());
            updateStatsAfterRemoval();
            if (window.ApiUtils) ApiUtils.showSuccess(`"${project.title || 'Project'}" deleted.`);
            if (!grid.querySelector('[data-project-uuid]')) {
              grid.classList.add('hidden');
              tableWrap.classList.add('hidden');
              if (viewToggle) viewToggle.classList.add('hidden');
              empty.classList.remove('hidden');
            }
          } catch (err) {
            const message = 'Could not delete project: ' + (err.message || 'unknown error');
            if (window.ApiUtils) ApiUtils.showError(message);
            triggerBtn.disabled = false;
            triggerBtn.textContent = 'Delete';
          }
        }

        function updateStatsAfterRemoval() {
          const cards = grid.querySelectorAll('[data-project-uuid]');
          document.getElementById('stat-posts').textContent = cards.length;
          mine = mine.filter(p => grid.querySelector(`[data-project-uuid="${p.uuid}"]`));
          document.getElementById('stat-published').textContent = mine.filter(p => (p.status || '').toLowerCase() === 'published').length;
          document.getElementById('stat-draft').textContent = mine.filter(p => (p.status || '').toLowerCase() !== 'published').length;
        }

        try {
          const me = await UsersAPI.getCurrentUser();
          const displayName = (me && (me.given_name || me.username))
            ? `${me.given_name || ''} ${me.family_name || ''}`.trim() || me.username
            : 'Your Profile';
          document.getElementById('profileName').textContent = displayName;
          document.getElementById('profileUsername').textContent = me && me.username ? '@' + me.username : '';
          if (window.AuthAPI) AuthAPI.renderUserAvatar(document.getElementById('profileAvatar'), me);

          const navProfileName = document.getElementById('navProfileName');
          if (navProfileName) navProfileName.textContent = displayName;
          if (window.AuthAPI) AuthAPI.renderUserAvatar(document.getElementById('navProfileAvatar'), me);

          // No "my projects" endpoint exists on the backend, so we fetch a
          // generous page of all projects and filter by ownership client-side.
          const all = await ProjectsAPI.getAllProjects({ page: 1, size: 100 });
          mine = (Array.isArray(all) ? all : []).filter(p => p.owner && me && p.owner.uuid === me.uuid);

          loading.classList.add('hidden');

          document.getElementById('stat-posts').textContent = mine.length;
          document.getElementById('stat-published').textContent = mine.filter(p => (p.status || '').toLowerCase() === 'published').length;
          document.getElementById('stat-draft').textContent = mine.filter(p => (p.status || '').toLowerCase() !== 'published').length;

          if (mine.length === 0) {
            empty.classList.remove('hidden');
            return;
          }

          mine.forEach(project => {
            grid.appendChild(renderCard(project));
            tableBody.appendChild(renderTableRow(project));
          });
          // Table view scales much better once there are many projects --
          // default to it once the card grid would otherwise get unwieldy.
          if (viewToggle) viewToggle.classList.remove('hidden');
          setView(mine.length > 8 ? 'table' : (localStorage.getItem('stadia_dashboard_view') || 'cards'));
        } catch (err) {
          console.error('Failed to load dashboard:', err);
          loading.classList.add('hidden');
          empty.textContent = 'Failed to load your projects. Please try again.';
          empty.classList.remove('hidden');
        }
      });
    </script>
  </body>
  </html>
